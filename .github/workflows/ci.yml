# Builds the full system closure on pushes to master and on pull requests.
# Note: does not fire on PRs opened by flake-update.yml (GITHUB_TOKEN PRs
# don't trigger pull_request workflows) — that workflow validates inline.
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Build system closure
        run: |
          nix build .#nixosConfigurations.nixos.config.system.build.toplevel \
            --out-link result --print-build-logs
