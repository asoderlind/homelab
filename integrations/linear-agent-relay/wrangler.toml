name = "hyperion-linear-agent-relay"
main = "src/index.ts"
compatibility_date = "2026-08-26"

[vars]
# Change this to the deployed Worker URL before installing the Linear apps.
PUBLIC_BASE_URL = "https://hyperion-linear-agent-relay.example.workers.dev"
LINEAR_OWNER_ID = "replace-with-linear-user-id"

[[d1_databases]]
binding = "DB"
database_name = "linear-agent-relay"
database_id = "replace-with-d1-database-id"
migrations_dir = "migrations"

[observability.logs]
enabled = true
